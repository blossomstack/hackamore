version: 2
updates:
  # Rust crate dependencies across the workspace.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
      time: "18:00"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 10
    groups:
      cargo-routine:
        # Group routine minor/patch updates into a single daily PR.
        update-types:
          - minor
          - patch
        # Breaking-prone libraries are excluded so they arrive as individual,
        # reviewable PRs. These are 0.x crates whose "minor" bumps are de-facto
        # breaking, and the proxy's TLS/HTTP stack has to move as a set.
        exclude-patterns:
          - "axum"
          - "reqwest"
          - "tower"
          - "hyper-util"
          - "tokio-rustls"
    # Semver-major updates are not covered by the group above, so they open as
    # individual PRs automatically.

  # Keeps the actions used by ci.yml and publish.yml current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "18:00"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 5
    groups:
      all-actions:
        patterns:
          - "*"
